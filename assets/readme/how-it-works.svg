<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">How a Weekly Beats week works</title>
  <desc id="d">Four stages: on Tuesday you drop a song that fits the theme; from Tuesday to Friday you play chips, with attacks hidden; over the weekend the Game Master scores every song blind; on Monday the reveal awards points, resolves chips and updates the ladder. Then a new week starts.</desc>
  <defs><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#000" fill-opacity="0.18"/></pattern></defs>
  <rect width="1200" height="320" rx="24" fill="#080B14"/>
  <rect width="1200" height="320" rx="24" fill="url(#scan)"/>
  <rect x="1.5" y="1.5" width="1197" height="317" rx="23" fill="none" stroke="#1E2550" stroke-width="3"/>
  <text x="64" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="4" fill="#7070A0">ONE WEEK · FOUR STAGES · THEN AGAIN</text>
  <path d="M24 152 H1072" stroke="#1E2550" stroke-width="4" stroke-dasharray="8 8" transform="translate(40 0)"/>
  <g transform="translate(64 0)">
    <text x="0" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#FFD700">TUE</text>
    <rect x="0" y="140" width="24" height="24" fill="#00E5FF"/>
    <rect x="6" y="146" width="12" height="12" fill="#080B14"/>
    <rect x="32" y="138" width="40" height="28" fill="#080B14"/>
    <text x="40" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#7070A0">01</text>
    <text x="0" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF">Drop a song</text>
    <text x="0" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#9A9AC4">Paste a Spotify or YouTube</text>
    <text x="0" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#9A9AC4">link that fits the theme.</text>
  </g>
  <g transform="translate(340 0)">
    <text x="0" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#FFD700">TUE–FRI</text>
    <rect x="0" y="140" width="24" height="24" fill="#FF2D87"/>
    <rect x="6" y="146" width="12" height="12" fill="#080B14"/>
    <rect x="32" y="138" width="40" height="28" fill="#080B14"/>
    <text x="40" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#7070A0">02</text>
    <text x="0" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF">Play chips</text>
    <text x="0" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#9A9AC4">Attack, defend or buff.</text>
    <text x="0" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#9A9AC4">Attacks stay hidden.</text>
  </g>
  <g transform="translate(616 0)">
    <text x="0" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#FFD700">SAT–SUN</text>
    <rect x="0" y="140" width="24" height="24" fill="#9B59B6"/>
    <rect x="6" y="146" width="12" height="12" fill="#080B14"/>
    <rect x="32" y="138" width="40" height="28" fill="#080B14"/>
    <text x="40" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#7070A0">03</text>
    <text x="0" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF">GM scores blind</text>
    <text x="0" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#9A9AC4">No names, just the music.</text>
    <text x="0" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#9A9AC4">Top three make the podium.</text>
  </g>
  <g transform="translate(892 0)">
    <text x="0" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#FFD700">MON</text>
    <rect x="0" y="140" width="24" height="24" fill="#FFD700"/>
    <rect x="6" y="146" width="12" height="12" fill="#080B14"/>
    <rect x="32" y="138" width="40" height="28" fill="#080B14"/>
    <text x="40" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#7070A0">04</text>
    <text x="0" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF">The reveal</text>
    <text x="0" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#9A9AC4">Points land, chips resolve,</text>
    <text x="0" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#9A9AC4">the ladder updates.</text>
  </g>
</svg>
